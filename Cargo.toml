[package]
name = "tuikit"
version = "0.1.0"
edition = "2021"
description = "The look and the keys shared by the terminal apps (eardrill, rdtui, sonetui)"
license = "MIT"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
toml = "0.9"
ratatui-kit = { git = "https://github.com/cammellos/ratatui-kit", rev = "1b35d2595429016558ddb896431a79b1c67ae389", features = ["tree", "table"] }
zeroize = "1"

[dev-dependencies]
ratatui-kit = { git = "https://github.com/cammellos/ratatui-kit", rev = "1b35d2595429016558ddb896431a79b1c67ae389", features = ["test-util"] }
